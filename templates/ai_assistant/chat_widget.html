<!-- AI Learning Assistant Chat Widget -->
<div class="page-card mt-4 border-start border-4 shadow-sm" style="border-color: #8b5cf6 !important;">
    <h6 class="fw-semibold mb-3 d-flex align-items-center">
        <i class="bi bi-robot me-2 fs-5 text-purple" style="color: #8b5cf6;"></i>
        AI Learning Assistant
    </h6>
    
    <!-- Chat History Box -->
    <div id="ai-chat-history" class="p-3 mb-3 bg-light rounded" style="height: 300px; overflow-y: auto; border: 1px solid #e5e7eb;">
        <div class="text-center text-muted small mt-4">
            <i class="bi bi-chat-dots fs-3 opacity-50 mb-2 d-block"></i>
            Ask a question about this course!
        </div>
    </div>

    <!-- Input Form -->
    <form id="ai-chat-form" class="d-flex gap-2">
        {% csrf_token %}
        <input type="hidden" id="course-id" value="{{ course.id }}">
        <input type="text" id="ai-question" class="form-control" placeholder="Ask a question about this lesson..." required autocomplete="off">
        <button type="submit" class="btn text-white px-4 fw-bold" style="background: linear-gradient(135deg, #8b5cf6, #6d28d9);" id="ai-send-btn">
            <i class="bi bi-send-fill"></i> Send
        </button>
    </form>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const chatHistoryBox = document.getElementById("ai-chat-history");
        const chatForm = document.getElementById("ai-chat-form");
        const questionInput = document.getElementById("ai-question");
        const courseId = document.getElementById("course-id").value;
        const sendBtn = document.getElementById("ai-send-btn");

        // Load existing history
        fetch(`/api/ai-assistant/history/${courseId}/`)
            .then(res => res.json())
            .then(data => {
                if (data.history && data.history.length > 0) {
                    chatHistoryBox.innerHTML = '';
                    data.history.forEach(msg => {
                        appendMessage("You", msg.question, true);
                        appendMessage("AI Assistant", msg.answer, false);
                    });
                    scrollToBottom();
                }
            })
            .catch(err => console.error("Could not load AI chat history", err));

        chatForm.addEventListener("submit", function(e) {
            e.preventDefault();
            const question = questionInput.value.trim();
            if (!question) return;

            // Optimistically append user message
            if(chatHistoryBox.innerHTML.includes("Ask a question about this course!")) {
                chatHistoryBox.innerHTML = '';
            }
            appendMessage("You", question, true);
            questionInput.value = "";
            const spinnerId = appendSpinner();
            scrollToBottom();

            // Disable button
            sendBtn.disabled = true;

            // Make API Call
            fetch('/api/ai-assistant/ask/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                },
                body: JSON.stringify({
                    course_id: courseId,
                    question: question
                })
            })
            .then(res => res.json())
            .then(data => {
                removeSpinner(spinnerId);
                sendBtn.disabled = false;
                
                if (data.error) {
                    appendMessage("System Error", data.error, false, true);
                } else {
                    appendMessage("AI Assistant", data.answer, false);
                }
                scrollToBottom();
            })
            .catch(err => {
                removeSpinner(spinnerId);
                sendBtn.disabled = false;
                appendMessage("System Error", "Connection failed. Try again.", false, true);
                scrollToBottom();
            });
        });

        function appendMessage(sender, text, isUser, isError=false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `mb-3 p-3 rounded-4 shadow-sm ${isUser ? 'ms-auto bg-white border border-primary-subtle' : 'me-auto text-white'}`;
            msgDiv.style.maxWidth = '85%';
            msgDiv.style.width = 'fit-content';
            
            if (!isUser) {
                if(isError) {
                    msgDiv.style.background = '#ef4444';
                } else {
                    msgDiv.style.background = 'linear-gradient(135deg, #8b5cf6, #7c3aed)';
                }
            } else {
                msgDiv.style.background = '#f8f9fa';
                msgDiv.style.border = '1px solid #e0e7ff';
            }

            msgDiv.innerHTML = `
                <div style="font-size: 0.75rem; opacity: ${isUser ? '0.6' : '0.8'}; font-weight: bold; margin-bottom: 4px;">
                    ${isUser ? '<i class="bi bi-person me-1"></i>' : '<i class="bi bi-robot me-1"></i>'}${sender}
                </div>
                <div style="font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap;">${escapeHTML(text)}</div>
            `;
            chatHistoryBox.appendChild(msgDiv);
        }

        function appendSpinner() {
            const id = 'spinner-' + Date.now();
            const msgDiv = document.createElement('div');
            msgDiv.id = id;
            msgDiv.className = `mb-3 p-3 rounded-4 shadow-sm me-auto text-white`;
            msgDiv.style.maxWidth = '85%';
            msgDiv.style.background = 'linear-gradient(135deg, #8b5cf6, #7c3aed)';
            msgDiv.innerHTML = `
                <div style="font-size: 0.75rem; opacity: 0.8; font-weight: bold; margin-bottom: 4px;">
                    <i class="bi bi-robot me-1"></i>AI Assistant
                </div>
                <div class="spinner-border spinner-border-sm text-light" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div> Thinking...
            `;
            chatHistoryBox.appendChild(msgDiv);
            return id;
        }

        function removeSpinner(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function scrollToBottom() {
            chatHistoryBox.scrollTop = chatHistoryBox.scrollHeight;
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }
    });
</script>
