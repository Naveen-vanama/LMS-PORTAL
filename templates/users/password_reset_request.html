{% extends 'base.html' %}
{% block title %}Forgot Password &ndash; LMSPORTAL{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="page-card shadow-sm mt-5">
            <h4 class="fw-bold mb-3 text-center">Forgot Password</h4>
            <p class="text-muted small text-center mb-4">Enter your registered email address and we'll send you an OTP to reset your password.</p>
            
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-bold">Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="example@domain.com" required>
                </div>
                
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary py-2 fw-semibold">Send OTP</button>
                    <a href="{% url 'users:login' %}" class="btn btn-link btn-sm text-decoration-none text-muted">Back to Login</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
