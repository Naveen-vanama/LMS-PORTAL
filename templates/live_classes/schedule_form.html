{% extends 'base.html' %}

{% block title %}Schedule Live Class - {{ course.title }}{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <h3 class="fw-bold mb-4">Schedule Live Class</h3>
                    <p class="text-muted mb-4 small">A unique meeting link will be automatically generated for this session.</p>
                    
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Class Title</label>
                            <input type="text" name="title" class="form-control" placeholder="e.g. Python Functions Deep Dive" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Description</label>
                            <textarea name="description" class="form-control" rows="3" placeholder="What should students expect?"></textarea>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Date & Time</label>
                                <input type="datetime-local" name="scheduled_time" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Duration (minutes)</label>
                                <input type="number" name="duration" class="form-control" value="60" required>
                            </div>
                        </div>
                        
                        <div class="mt-4 d-flex gap-2">
                            <button type="submit" class="btn btn-primary px-4">Schedule Class</button>
                            <a href="{% url 'live_classes:list' course.id %}" class="btn btn-light px-4">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
